<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technická podpora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-2xl bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur">
        
        <!-- Hlavička -->
        <div class="mb-6 pb-5 border-b border-slate-700/60">
            <h1 class="text-xl sm:text-2xl font-bold text-white">Technická podpora – Web & E-shop</h1>
            <p class="text-slate-400 text-sm mt-1">
                Jak ti můžeme pomoct? Napiš, jaký máš problém.
            </p>
        </div>

        <!-- Formulář -->
        <form id="supportForm" class="space-y-4">
            <div>
                <label for="question" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                    Tvůj dotaz:
                </label>
                <textarea 
                    id="question" 
                    name="question" 
                    rows="4" 
                    required 
                    placeholder="např. po potvrzení objednávky se mi nezobrazí košík..." 
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                ></textarea>
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                    E-mail (nepovinné):
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="tvuj@email.cz" 
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn" 
                class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium text-sm px-6 py-3 rounded-xl shadow-lg transition-all"
            >
                <span id="btnText">Odeslat dotaz</span>
            </button>
        </form>

        <!-- Sekce odpovědi přímo pod formulářem -->
        <div class="mt-8 pt-6 border-t border-slate-700/80">
            <h2 class="text-base font-semibold text-white mb-3">
                Odpověď podpory:
            </h2>
            
            <div id="responseContainer" class="bg-slate-900/80 border border-slate-700/70 rounded-xl p-5 min-h-[90px] text-sm text-slate-300">
                <span class="text-slate-500 italic">Zatím nebyl odeslán žádný dotaz.</span>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
